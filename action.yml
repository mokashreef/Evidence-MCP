name: 'Evidence MCP Verification Action'
description: 'Verifies evidence bundles, validates multi-agent consensus quorum, and posts rich step summaries in GitHub Actions.'
author: 'mohammad abu kashreef'

inputs:
  bundle-id:
    description: 'The ID of the evidence bundle to verify (e.g. bundle_12345678).'
    required: true
  workspace-path:
    description: 'Path to workspace directory (defaults to github.workspace).'
    required: false
    default: '.'
  require-quorum:
    description: 'Whether to require multi-agent quorum consensus to pass.'
    required: false
    default: 'false'
  min-endorsements:
    description: 'Minimum required peer endorsements for quorum check.'
    required: false
    default: '1'
  required-roles:
    description: 'Comma-separated list of required reviewer roles (e.g. "tester,security_auditor").'
    required: false
    default: ''
  require-policy:
    description: 'Whether to enforce automated evidence policy compliance.'
    required: false
    default: 'false'
  policy-file:
    description: 'Optional path to evidence.policy.json file.'
    required: false
    default: ''
  webhook-url:
    description: 'Optional webhook URL to dispatch signed audit notification.'
    required: false
    default: ''
  webhook-secret:
    description: 'Optional HMAC-SHA256 secret token for webhook dispatch.'
    required: false
    default: ''
  sarif-output:
    description: 'Optional output path for SARIF v2.1.0 report (e.g. evidence-results.sarif) for GitHub Code Scanning.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build Evidence MCP
      shell: bash
      run: npm run build

    - name: Verify Evidence Bundle
      shell: bash
      run: |
        node dist/cli.js verify "${{ inputs.bundle-id }}" --workspace "${{ inputs.workspace-path }}"

    - name: Check Quorum (if enabled)
      if: ${{ inputs.require-quorum == 'true' }}
      shell: bash
      run: |
        ROLES_ARG=""
        if [ -n "${{ inputs.required-roles }}" ]; then
          ROLES_ARG="--roles ${{ inputs.required-roles }}"
        fi
        node dist/cli.js quorum "${{ inputs.bundle-id }}" --min "${{ inputs.min-endorsements }}" $ROLES_ARG --workspace "${{ inputs.workspace-path }}"

    - name: Evaluate Policy (if enabled)
      if: ${{ inputs.require-policy == 'true' }}
      shell: bash
      run: |
        POLICY_ARG=""
        if [ -n "${{ inputs.policy-file }}" ]; then
          POLICY_ARG="--policy ${{ inputs.policy-file }}"
        fi
        node dist/cli.js policy "${{ inputs.bundle-id }}" $POLICY_ARG --workspace "${{ inputs.workspace-path }}"

    - name: Dispatch Webhook (if configured)
      if: ${{ inputs.webhook-url != '' }}
      shell: bash
      run: |
        SECRET_ARG=""
        if [ -n "${{ inputs.webhook-secret }}" ]; then
          SECRET_ARG="--secret ${{ inputs.webhook-secret }}"
        fi
        node dist/cli.js webhook "${{ inputs.bundle-id }}" "${{ inputs.webhook-url }}" $SECRET_ARG --proof --workspace "${{ inputs.workspace-path }}"

    - name: Export SARIF Report (if configured)
      if: ${{ inputs.sarif-output != '' }}
      shell: bash
      run: |
        POLICY_ARG=""
        if [ -n "${{ inputs.policy-file }}" ]; then
          POLICY_ARG="--policy ${{ inputs.policy-file }}"
        fi
        node dist/cli.js report "${{ inputs.bundle-id }}" --format sarif $POLICY_ARG --output "${{ inputs.sarif-output }}" --workspace "${{ inputs.workspace-path }}"

    - name: Generate GitHub Step Summary
      shell: bash
      run: |
        node dist/cli.js summary "${{ inputs.bundle-id }}" --github --workspace "${{ inputs.workspace-path }}"

