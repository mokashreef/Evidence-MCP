name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package/verify (e.g. v1.4.0)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, Pack & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Package
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Pack Release Tarball
        run: npm pack

      - name: Publish to npm (if NPM_TOKEN is configured)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN secret is not configured; skipping npm publish."
          fi

      - name: Ensure GitHub Release & Attach Tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TARBALL="$(ls *.tgz | head -n 1)"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$TARBALL" --clobber
          else
            gh release create "$TAG_NAME" "$TARBALL" --title "Evidence MCP ${TAG_NAME}" --generate-notes
          fi
